<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM EDIT & REMOVE</title>
</head>
<body style="background-color: black; color: white;">
    <ul class="language">
        <li >JavaScript</li>
    </ul>
</body>
<script>
    function addlanguage(lang) {
        const li = document.createElement("li");
        li.innerText = `${lang}`;// li.innerHTML bhiuse kar sakte h, dono same kaam karenge, innerText se hum text content set karte h, aur innerHTML se hum html content set karte h, dono me farak ye h ki innerHTML me hum html tags bhi use kar sakte h, jabki innerText me hum sirf text hi set kar sakte h.
        document.querySelector(".language").appendChild(li); 
    }
    addlanguage("Python")
    addlanguage("Java")
    //basic h ek elem ek bar me dalna ho to but bahoot sare ke lye loop lagana hoga 
// end problem ye he ki bahoot bar traverse jrna hoga pura function code har ek element ke liye

function addoptilanguage(lang){
    const li = document.createElement("li");
    li.appendChild(document.createTextNode(lang));
    document.querySelector(".language").appendChild(li);
}
addoptilanguage("C++")

//edit
  const secondLang = document.querySelector("li:nth-child(2)")
    console.log(secondLang);
    //secondLang.innerHTML = "Mojo"
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secondLang.replaceWith(newli)

//edit
 const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>TypeScript</li>'

    //remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()


</script>
</html>
