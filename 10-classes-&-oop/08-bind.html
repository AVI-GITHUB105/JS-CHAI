<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>
</body>
<script>
    class React {
        constructor(){
            this.library = "React"
            this.server = "https://localhost:300"

            //requirement
            document
                .querySelector('button')
                .addEventListener('click', this.handleClick.bind(this))// in this.handelclick this me button ka rifrence h kyuki (jisne) call kiya usi ka hoga
// this inside handleClick would point to the HTML Button element, not your React class.
//console.log(this.server) would return undefined because buttons don't have a server property.
//thats why use bind(this) it will attach or give the reference of react properties to with refernce of handleclick
        }
        handleClick(){
            console.log("button clicked");
            console.log(this.server);
        }
    }

    const app = new React()
</script>
</html>
